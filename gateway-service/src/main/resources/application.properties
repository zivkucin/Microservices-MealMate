spring.application.name=gateway-service
server.port=8085

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/


# =========================
# REVIEW - recipe reviews
# =========================

spring.cloud.gateway.server.webmvc.routes[0].id=review-service-recipe-reviews
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://REVIEW-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/recipes/*/reviews/**


